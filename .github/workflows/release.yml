name: Build & release

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pip install pytest && pnpm test
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: decky-system-monitor
          path: release/decky-system-monitor.zip

      # Tag vX.Y.Z -> release (prerelease if the tag contains "-", e.g. v0.1.0-rc1)
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" release/decky-system-monitor.zip \
            --title "$GITHUB_REF_NAME" --generate-notes $flags

      # Branch push / manual run -> rolling "test-build" prerelease for device testing
      - name: Publish rolling test build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build release/decky-system-monitor.zip \
            --prerelease --target "$GITHUB_SHA" \
            --title "Test build ($GITHUB_REF_NAME @ ${GITHUB_SHA::7})" \
            --notes "Automatic test build from \`$GITHUB_REF_NAME\` at $GITHUB_SHA. Not a stable release."
